# Default convert-time parameters for the RKNN export path
# (scripts/export_rknn.py). Kept in one file so a number in the report can
# be traced back to the exact configuration that produced the .rknn file --
# same rule as configs/exp/*.yaml.
#
# These are DEFAULTS the script's CLI flags override; they are not read
# automatically by export_rknn.py in this round (it takes its parameters
# from argv). This file exists as the single source of truth to copy flags
# from, and as the reference `docs/rknn-pipeline.md` points at.

target_platform: rk3588
imgsz: 640

# end2end MUST be false: YOLO26's default end-to-end (NMS-free) head
# segfaults at inference on RK3588 (ultralytics#23753, KNOWN_ISSUES.md #2).
end2end: false

# RKNN bakes normalisation into the model; the runtime then expects raw
# uint8 NHWC input (letterbox(..., normalize=False)). Get this wrong and
# the model detects nothing with no error (KNOWN_ISSUES.md #4).
mean_values: [0.0, 0.0, 0.0]
std_values: [255.0, 255.0, 255.0]
input_dtype: uint8
layout: nhwc

precisions:
  - fp16   # the product path -- see docs/experiment-ids.md N1
  - int8   # a research question, not the default -- see N2 and KNOWN_ISSUES.md #3

# INT8 calibration: must be real images, never random noise (same rule as
# scripts/export_models.py for the TFLite path).
min_calib_images: 50
