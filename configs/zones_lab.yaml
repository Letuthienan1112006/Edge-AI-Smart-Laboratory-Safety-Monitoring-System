# Lab room zones (camera position of boot014, 2026-10-06). NORMALISED coordinates (0..1).
# requires: [lab_coat] -> entering in a lab coat is allowed; without one it is a `zone_ppe_violation`.
# Without `requires` a zone forbids everyone (`zone_intrusion`).
# A person counts as inside when the bottom-centre of their box (their feet) is inside the polygon,
# so these polygons are drawn on the FLOOR in front of the furniture, not on the furniture itself.
# Redraw after moving the camera. This 21-point outline is the dashboard drawing from 20/10, repaired on 21/10:
# ordered as one simple polygon and closed on y=1.0 so bottom-clipped people remain inside.
