# Classes for the first full A+B+C system on the board (see configs/exp/L1_*, L2_*).
# stage_a: COCO-80 head, only `person` is kept via keep_classes. stage_b/stage_c: models trained in
# this repo (KNOWN_ISSUES #28, #29). `lab_coat` and `mask` are NOT here: no model produces them yet,
# and a required item the detector can never report flags every person forever (app.py guard).
