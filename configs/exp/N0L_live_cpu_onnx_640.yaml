# N0L: CPU control condition for N1L -- same live-run purpose (plan §1,
# docs/KNOWN_ISSUES.md #20), same model family (ONNX FP32, imgsz 640, the N0
# reference weights), but on CPU so N1L's NPU numbers can be compared
# against something rather than assumed to be a win
# (RKNNBackend's own docstring: "always compare against the CPU backend").
# NOT a point in the N-matrix. Stage B/C disabled, same reasons as N1L.
# Dashboard and GPIO are off in every bench config on purpose.
source:
  device: 0
  width: 640
  height: 480
  fps: 30
stage_a:
  backend: onnx
  weights: runs/export/yolo26n_640.onnx
  imgsz: 640
  conf: 0.4
  iou: 0.5
  engine: cpu_big
  threads: 4
  keep_classes: [person]
stage_b:
  enabled: false
stage_c:
  enabled: false
fall:
  enabled: true
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  still_duration_s: 2.5
  still_iou_threshold: 0.7
zones:
  enabled: true
  file: configs/zones.yaml
tracker:
  max_age_s: 1.5
  iou_match_threshold: 0.3
affinity:
  cpus: big
alerts:
  debounce_s: 3.0
  cooldown_s: 10.0
  buzzer_pin: 17
  led_r_pin: 27
  led_g_pin: 22
  gpio: 'off'
dashboard:
  enabled: false
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70
