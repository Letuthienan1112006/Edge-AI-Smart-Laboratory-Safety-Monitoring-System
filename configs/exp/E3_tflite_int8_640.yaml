# Generated by the Phase-1 scaffold. One experiment = one file, so a
# number in the paper can be traced to the exact configuration.
# Dashboard and GPIO are off in every bench config on purpose.
# E3: E2 quantised to INT8. Report per-slice mAP here.
source:
  device: 0
  width: 640
  height: 480
  fps: 30
stage_a:
  backend: tflite
  weights: runs/train/stage_a/weights/best_int8.tflite
  imgsz: 640
  conf: 0.4
  iou: 0.5
stage_b:
  enabled: true
  backend: tflite
  weights: runs/train/stage_b/weights/best_int8.tflite
  imgsz: 224
  conf: 0.45
  recheck_interval_s: 2.0
  crop_padding: 0.12
stage_c:
  enabled: true
  backend: tflite
  weights: runs/train/stage_c/weights/best_int8.tflite
  imgsz: 224
  conf: 0.6
  interval_s: 0.0
fall:
  enabled: true
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  still_duration_s: 2.5
  still_iou_threshold: 0.7
zones:
  enabled: true
  file: configs/zones.yaml
tracker:
  max_age_s: 1.5
  iou_match_threshold: 0.3
alerts:
  debounce_s: 3.0
  cooldown_s: 10.0
  buzzer_pin: 17
  led_r_pin: 27
  led_g_pin: 22
  gpio: 'off'
dashboard:
  enabled: false
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70
