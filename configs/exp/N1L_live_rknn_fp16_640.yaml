# N1L: first live run on the board, same model as N1 (RKNN FP16, imgsz
# 640), stage A only. NOT a point in the N-matrix (scripts/bench/bench_matrix_npu.sh
# does not touch this file) -- it is a one-off evaluation run with:
#   * `--classes configs/classes_coco80.yaml` (this checkpoint is
#     COCO-pretrained, not fine-tuned for this project's own person/PPE
#     taxonomy -- see docs/KNOWN_ISSUES.md #20);
#   * stage_a.keep_classes: [person], so the router only ever tracks people,
#     not "any of 80 COCO classes";
#   * stage B/C disabled (no PPE/fire model exists yet, and the stub's
#     sim_latency_ms would add fabricated latency into a first real-hardware
#     measurement -- see plan §1).
# Dashboard and GPIO are off in every bench config on purpose.
source:
  device: 0
  width: 640
  height: 480
  fps: 30
stage_a:
  backend: rknn
  weights: runs/export/yolo26n_fp16_640.rknn
  imgsz: 640
  conf: 0.4
  iou: 0.5
  engine: npu
  core_mask: auto
  keep_classes: [person]
stage_b:
  enabled: false
stage_c:
  enabled: false
fall:
  enabled: true
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  still_duration_s: 2.5
  still_iou_threshold: 0.7
zones:
  enabled: true
  file: configs/zones.yaml
tracker:
  max_age_s: 1.5
  iou_match_threshold: 0.3
affinity:
  cpus: big
alerts:
  debounce_s: 3.0
  cooldown_s: 10.0
  buzzer_pin: 17
  led_r_pin: 27
  led_g_pin: 22
  gpio: 'off'
dashboard:
  enabled: false
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70
