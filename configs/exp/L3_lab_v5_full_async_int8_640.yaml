# L3: the lab system (stage A = lab_v5 INT8: person + lab_coat, zone rule) + stage B (per-person crop check, compute
# proxy, see configs/classes_lab_v5_full.yaml) + stage C fire/smoke, async on NPU cores 0/1/2. Same file for both modes:
#   --mode adaptive  (B only for people due a re-check, C at 1 Hz)   vs   --mode parallel (B and C every frame)
# Run with --classes configs/classes_lab_v5_full.yaml
affinity:
  cpus: big
alerts:
  buzzer_pin: 17
  cooldown_s: 60.0
  debounce_s: 3.0
  gpio: 'off'
  led_g_pin: 22
  led_r_pin: 27
dashboard:
  enabled: false
  host: 0.0.0.0
  jpeg_quality: 70
  port: 8000
fall:
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  enabled: true
  still_duration_s: 2.5
  still_iou_threshold: 0.7
source:
  device: 0
  fps: 30
  height: 480
  width: 640
stage_a:
  backend: rknn
  conf: 0.4
  core_mask: '0'
  engine: npu
  imgsz: 640
  iou: 0.5
  keep_classes:
  - person
  - lab_coat
  weights: runs/export/lab_v6_split_int8_640.rknn
stage_b:
  enabled: true
  backend: rknn
  weights: runs/export/stageB_crops_y26n_best_int8_320.rknn
  imgsz: 320
  conf: 0.3
  iou: 0.5
  engine: npu
  core_mask: '1'
  recheck_interval_s: 2.0
  crop_padding: 0.1
stage_c:
  enabled: true
  backend: rknn
  weights: runs/export/stageC_fire_y26n_best_int8_416.rknn
  imgsz: 416
  conf: 0.5
  iou: 0.5
  engine: npu
  core_mask: '2'
  interval_s: 1.0
tracker:
  iou_match_threshold: 0.3
  max_age_s: 3.0
zones:
  enabled: true
  file: configs/zones_lab.yaml
  attire_min_conf: 0.6
  attire_memory_s: 2.0
async_stages: true
