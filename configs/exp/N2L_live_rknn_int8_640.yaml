# N2L: live run on the board, RKNN INT8 (imgsz 640), stage A only -- the INT8
# counterpart of N1L, identical in every other key so the two differ in one
# variable only. Exported with scripts/export_rknn.py --precision int8 and a
# calibration set of 150 raw lab C270 frames + coco128
# (data/raw/lab_calib_20260929); parity gate vs ONNX FP32 PASSED on the board
# (runs/parity/lab_yolo26n_int8) only after the decoder honoured the card's
# box_coords="normalized" (KNOWN_ISSUES.md #24). NOT a point in the N-matrix.
source:
  device: 0
  width: 640
  height: 480
  fps: 30
stage_a:
  backend: rknn
  weights: runs/export/yolo26n_int8_640.rknn
  imgsz: 640
  conf: 0.4
  iou: 0.5
  engine: npu
  core_mask: auto
  keep_classes: [person]
stage_b:
  enabled: false
stage_c:
  enabled: false
fall:
  enabled: true
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  still_duration_s: 2.5
  still_iou_threshold: 0.7
zones:
  enabled: true
  file: configs/zones.yaml
tracker:
  max_age_s: 1.5
  iou_match_threshold: 0.3
affinity:
  cpus: big
alerts:
  debounce_s: 3.0
  cooldown_s: 10.0
  buzzer_pin: 17
  led_r_pin: 27
  led_g_pin: 22
  gpio: 'off'
dashboard:
  enabled: false
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70
