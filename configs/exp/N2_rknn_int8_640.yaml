# N2: RKNN INT8 on NPU, imgsz 640. A RESEARCH QUESTION, not the product
# default (plan §2.2) -- ultralytics#23753 is an open bug where INT8 convert
# succeeds but the model detects nothing. MUST pass
# scripts/validate_conversion.py; if it fails, report the failure as
# evidence (KNOWN_ISSUES.md #3), do not just drop N2 from the report.
# Dashboard and GPIO are off on purpose.
source:
  device: 0
  width: 640
  height: 480
  fps: 30
stage_a:
  backend: rknn
  weights: runs/export/yolo26n_int8_640.rknn
  imgsz: 640
  conf: 0.4
  iou: 0.5
  engine: npu
  core_mask: auto
stage_b:
  enabled: true
  backend: stub
  weights: null
  imgsz: 192
  conf: 0.45
  sim_latency_ms: 30
  recheck_interval_s: 2.0
  crop_padding: 0.12
  engine: cpu_any
stage_c:
  enabled: true
  backend: stub
  weights: null
  imgsz: 224
  conf: 0.6
  sim_latency_ms: 40
  interval_s: 1.0
  engine: cpu_any
fall:
  enabled: true
  aspect_ratio_threshold: 1.15
  center_drop_ratio: 0.18
  drop_window_s: 1.0
  still_duration_s: 2.5
  still_iou_threshold: 0.7
zones:
  enabled: true
  file: configs/zones.yaml
tracker:
  max_age_s: 1.5
  iou_match_threshold: 0.3
alerts:
  debounce_s: 3.0
  cooldown_s: 10.0
  buzzer_pin: 17
  led_r_pin: 27
  led_g_pin: 22
  gpio: 'off'
dashboard:
  enabled: false
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 70
